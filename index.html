<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpeedType</title>
  <style>
    :root {
      --bg: #232531;
      --bg-deep: #1d1f2a;
      --panel: #2b2e3b;
      --panel-soft: #303443;
      --text: #d7d9e4;
      --muted: #777d91;
      --muted-2: #585f72;
      --gold: #f3b11d;
      --gold-soft: rgba(243, 177, 29, 0.14);
      --red: #ff5d6c;
      --red-soft: rgba(255, 93, 108, 0.16);
      --green: #62d996;
      --line: rgba(255, 255, 255, 0.08);
      --shadow: 0 30px 90px rgba(0, 0, 0, 0.32);
      --mono: "Cascadia Mono", "Consolas", "Courier New", monospace;
      --sans: "Segoe UI", Tahoma, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      min-height: 100%;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent 34%),
        radial-gradient(circle at top, rgba(243, 177, 29, 0.08), transparent 30%),
        var(--bg);
      color: var(--text);
      font-family: var(--sans);
      overflow-x: hidden;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app {
      width: min(1180px, calc(100% - 40px));
      min-height: 100%;
      margin: 0 auto;
      padding: 30px 0 42px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      color: var(--muted);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--mono);
      font-size: 19px;
      font-weight: 800;
      direction: ltr;
      letter-spacing: 0;
      color: #c8ccd8;
    }

    .brand-mark {
      width: 28px;
      height: 20px;
      border: 2px solid var(--muted-2);
      border-radius: 6px;
      position: relative;
    }

    .brand-mark::before,
    .brand-mark::after {
      content: "";
      position: absolute;
      top: 6px;
      width: 4px;
      height: 4px;
      border-radius: 1px;
      background: var(--muted-2);
      box-shadow: 7px 0 0 var(--muted-2), 14px 0 0 var(--muted-2);
    }

    .brand-mark::before {
      left: 5px;
    }

    .brand-mark::after {
      display: none;
    }

    .brand span {
      color: var(--gold);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .ghost-button,
    .primary-button,
    .icon-button {
      min-height: 38px;
      color: var(--muted);
      background: transparent;
      border-radius: 8px;
      transition: color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    .ghost-button {
      padding: 0 13px;
      border: 1px solid transparent;
    }

    .ghost-button:hover,
    .icon-button:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.05);
    }

    .primary-button {
      padding: 0 17px;
      color: var(--bg-deep);
      background: var(--gold);
      font-weight: 800;
      box-shadow: 0 12px 30px rgba(243, 177, 29, 0.18);
    }

    .primary-button:hover {
      transform: translateY(-1px);
      background: #ffc13b;
    }

    .icon-button {
      width: 40px;
      display: grid;
      place-items: center;
      border: 1px solid transparent;
      font-family: var(--mono);
      font-weight: 800;
    }

    .settings {
      background: rgba(30, 32, 43, 0.78);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .setting-group {
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .setting-label {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .segmented {
      display: flex;
      gap: 6px;
      flex: 1;
      min-width: 0;
    }

    .segmented button {
      flex: 1;
      min-width: 0;
      height: 34px;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      font-weight: 700;
      transition: background 160ms ease, color 160ms ease;
    }

    .segmented button.active {
      background: var(--gold-soft);
      color: var(--gold);
    }

    .duration-input {
      width: 86px;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 0 10px;
      background: var(--bg-deep);
      color: var(--gold);
      outline: 0;
      text-align: center;
      direction: ltr;
      font-family: var(--mono);
      font-weight: 800;
    }

    .custom-box {
      display: none;
      background: rgba(30, 32, 43, 0.74);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      box-shadow: var(--shadow);
    }

    .custom-box.active {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: stretch;
    }

    .custom-box textarea {
      min-height: 98px;
      max-height: 190px;
      resize: vertical;
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px 15px;
      background: var(--bg-deep);
      color: var(--text);
      outline: 0;
      line-height: 1.8;
    }

    .custom-box textarea:focus {
      border-color: rgba(243, 177, 29, 0.55);
      box-shadow: 0 0 0 4px rgba(243, 177, 29, 0.08);
    }

    .dashboard {
      display: grid;
      grid-template-columns: 170px 1fr;
      gap: 22px;
      align-items: center;
      min-height: 460px;
    }

    .metrics {
      display: grid;
      gap: 16px;
      align-content: center;
    }

    .metric {
      display: grid;
      gap: 1px;
      font-family: var(--mono);
    }

    .metric span {
      color: var(--muted);
      font-size: 14px;
      font-weight: 800;
      direction: ltr;
      text-align: left;
    }

    .metric strong {
      color: var(--gold);
      font-size: clamp(34px, 5vw, 54px);
      line-height: 0.95;
      direction: ltr;
      text-align: left;
      letter-spacing: 0;
    }

    .metric small {
      color: var(--muted-2);
      font-size: 12px;
      text-align: left;
      direction: ltr;
      min-height: 18px;
    }

    .typing-card {
      min-height: 380px;
      border-radius: 8px;
      position: relative;
      display: grid;
      place-items: center;
      padding: 32px 26px;
      outline: 0;
      overflow: hidden;
    }

    .typing-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.045), transparent),
        linear-gradient(180deg, rgba(255, 255, 255, 0.025), transparent);
      opacity: 0;
      transform: translateX(-18%);
      transition: opacity 180ms ease, transform 500ms ease;
      pointer-events: none;
    }

    .typing-card:focus-within::before,
    .typing-card.active::before {
      opacity: 1;
      transform: translateX(18%);
    }

    .stage {
      width: min(900px, 100%);
      display: grid;
      justify-items: center;
      gap: 28px;
      position: relative;
      z-index: 1;
    }

    .counter {
      font-family: var(--mono);
      color: var(--gold);
      font-size: clamp(50px, 8.6vw, 92px);
      font-weight: 900;
      line-height: 1;
      direction: ltr;
      letter-spacing: 0;
    }

    .word-stage {
      width: 100%;
      min-height: 118px;
      font-family: var(--mono);
      font-size: clamp(25px, 3.5vw, 43px);
      font-weight: 800;
      line-height: 1.6;
      text-align: center;
      color: var(--gold);
      overflow-wrap: anywhere;
      letter-spacing: 0;
      user-select: none;
    }

    .word-stage[dir="ltr"] {
      text-align: left;
    }

    .word-stage[dir="rtl"] {
      text-align: right;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      font-weight: 800;
    }

    .char {
      position: relative;
      color: var(--gold);
      border-radius: 4px;
      transition: color 80ms ease, background 80ms ease;
    }

    .char.correct {
      color: var(--muted);
    }

    .char.incorrect {
      color: var(--red);
      background: var(--red-soft);
      text-decoration: underline;
      text-decoration-thickness: 3px;
      text-underline-offset: 5px;
    }

    .char.cursor::before {
      content: "";
      position: absolute;
      width: 3px;
      height: 1.2em;
      top: 0.17em;
      inset-inline-start: -2px;
      border-radius: 999px;
      background: #f2f4fb;
      animation: blink 1s steps(2, start) infinite;
    }

    .char.space.incorrect {
      background: rgba(255, 93, 108, 0.28);
      text-decoration: none;
    }

    .typing-input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
      resize: none;
      border: 0;
      padding: 0;
      left: 50%;
      top: 50%;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      min-height: 46px;
    }

    .status-line {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 13px;
      direction: ltr;
      text-align: center;
      min-height: 20px;
    }

    .results {
      display: none;
      grid-template-columns: 210px 1fr;
      gap: 20px;
      align-items: stretch;
      background: rgba(30, 32, 43, 0.7);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
      box-shadow: var(--shadow);
    }

    .results.active {
      display: grid;
    }

    .result-stack {
      display: grid;
      gap: 12px;
      align-content: center;
    }

    .result-card {
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 13px;
      font-family: var(--mono);
      direction: ltr;
      text-align: left;
    }

    .result-card span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .result-card strong {
      color: var(--gold);
      font-size: 31px;
      line-height: 1.1;
    }

    .chart-wrap {
      min-height: 250px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.01));
      padding: 12px;
      position: relative;
    }

    #resultChart {
      width: 100%;
      height: 100%;
      min-height: 226px;
      display: block;
    }

    .legend {
      position: absolute;
      inset-inline-start: 18px;
      top: 14px;
      display: flex;
      gap: 13px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 12px;
      direction: ltr;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .legend span::before {
      content: "";
      width: 18px;
      height: 3px;
      border-radius: 999px;
      background: var(--gold);
    }

    .legend span:nth-child(2)::before {
      background: #8b90a5;
    }

    .footer-links {
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 18px;
      direction: ltr;
    }

    .footer-link {
      color: var(--muted);
      text-decoration: none;
      transition: color 160ms ease;
    }

    .footer-link:hover {
      color: var(--text);
    }

    .discord-wrap {
      display: grid;
      justify-items: center;
      gap: 6px;
    }

    .discord-invite {
      color: var(--muted-2);
      font-size: 11px;
      text-decoration: none;
      transition: color 160ms ease;
      white-space: nowrap;
    }

    .discord-invite:hover {
      color: var(--gold);
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    @media (max-width: 920px) {
      .settings {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .dashboard {
        grid-template-columns: 1fr;
        min-height: auto;
      }

      .metrics {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
      }

      .metric strong {
        font-size: 34px;
      }

      .typing-card {
        min-height: 360px;
      }

      .results {
        grid-template-columns: 1fr;
      }

      .result-stack {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      .app {
        width: min(100% - 22px, 1180px);
        padding-top: 16px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .top-actions {
        width: 100%;
        justify-content: flex-start;
      }

      .settings,
      .custom-box.active,
      .metrics,
      .result-stack {
        grid-template-columns: 1fr;
      }

      .setting-group {
        align-items: stretch;
        flex-direction: column;
      }

      .custom-box.active {
        align-items: stretch;
      }

      .typing-card {
        padding: 26px 12px;
      }

      .word-stage {
        font-size: 25px;
        min-height: 190px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand" aria-label="SpeedType">
        <span class="brand-mark" aria-hidden="true"></span>
        speed<span>type</span>
      </div>

      <div class="top-actions">
        <button class="ghost-button" id="newTextBtn" type="button">نص جديد</button>
        <button class="ghost-button" id="resetBtn" type="button">إعادة</button>
        <button class="primary-button" id="startBtn" type="button">ابدأ</button>
      </div>
    </header>

    <section class="settings" aria-label="إعدادات الاختبار">
      <div class="setting-group">
        <span class="setting-label">اللغة</span>
        <div class="segmented" id="languageButtons">
          <button type="button" class="active" data-language="ar">عربي</button>
          <button type="button" data-language="en">English</button>
        </div>
      </div>

      <div class="setting-group">
        <span class="setting-label">النص</span>
        <div class="segmented" id="sourceButtons">
          <button type="button" class="active" data-source="sample">جاهز</button>
          <button type="button" data-source="custom">مخصص</button>
        </div>
      </div>

      <div class="setting-group">
        <span class="setting-label">الوقت</span>
        <div class="segmented" id="timeButtons">
          <button type="button" class="active" data-time="30">30</button>
          <button type="button" data-time="60">60</button>
          <button type="button" data-time="120">120</button>
        </div>
      </div>

      <div class="setting-group">
        <span class="setting-label">ثواني</span>
        <input class="duration-input" id="durationInput" type="number" min="5" max="600" step="5" value="30" inputmode="numeric" />
      </div>
    </section>

    <section class="custom-box" id="customBox" aria-label="النص المخصص">
      <textarea id="customText" spellcheck="false">الكتابة السريعة مهارة تتحسن بالتدريب اليومي. اكتب بهدوء في البداية، ثم ارفع سرعتك عندما تصبح الحروف واضحة أمامك.</textarea>
      <button class="primary-button" id="applyCustomBtn" type="button">اعتماد</button>
    </section>

    <main class="dashboard">
      <aside class="metrics" aria-label="إحصائيات الاختبار">
        <div class="metric">
          <span>wpm</span>
          <strong id="wpmDisplay">0</strong>
          <small>words/min</small>
        </div>
        <div class="metric">
          <span>acc</span>
          <strong id="accuracyDisplay">100%</strong>
          <small>accuracy</small>
        </div>
        <div class="metric">
          <span>err</span>
          <strong id="errorDisplay">0</strong>
          <small>mistakes</small>
        </div>
        <div class="metric">
          <span>time</span>
          <strong id="timeDisplay">0/30</strong>
          <small>seconds</small>
        </div>
      </aside>

      <section class="typing-card" id="typingCard" tabindex="-1" aria-label="منطقة الكتابة">
        <div class="stage">
          <div class="counter" id="progressDisplay">0/0</div>
          <div class="word-stage" id="textDisplay" dir="rtl"></div>
          <div class="status-line" id="statusLine">ready</div>
        </div>
        <textarea class="typing-input" id="typingInput" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
      </section>
    </main>

    <div class="controls" aria-label="أوامر الاختبار">
      <button class="icon-button" id="focusBtn" type="button" title="تركيز">></button>
      <button class="icon-button" id="clearBtn" type="button" title="مسح">x</button>
      <button class="icon-button" id="againBtn" type="button" title="إعادة">r</button>
    </div>

    <section class="results" id="resultsPanel" aria-label="نتيجة الاختبار">
      <div class="result-stack">
        <div class="result-card">
          <span>wpm</span>
          <strong id="finalWpm">0</strong>
        </div>
        <div class="result-card">
          <span>acc</span>
          <strong id="finalAccuracy">0%</strong>
        </div>
        <div class="result-card">
          <span>chars</span>
          <strong id="finalChars">0/0</strong>
        </div>
        <div class="result-card">
          <span>best</span>
          <strong id="bestWpm">0</strong>
        </div>
      </div>
      <div class="chart-wrap">
        <div class="legend">
          <span>wpm</span>
          <span>acc</span>
        </div>
        <canvas id="resultChart"></canvas>
      </div>
    </section>

    <footer class="footer-links" aria-label="روابط المجتمع">
      <a class="footer-link" href="#" aria-label="GitHub">github</a>
      <div class="discord-wrap">
        <a class="footer-link" href="https://discord.gg/WZmsn2en6b" target="_blank" rel="noopener noreferrer" aria-label="Discord">discord</a>
        <a class="discord-invite" href="https://discord.gg/WZmsn2en6b" target="_blank" rel="noopener noreferrer">https://discord.gg/WZmsn2en6b</a>
      </div>
      <a class="footer-link" href="#" aria-label="Twitter">twitter</a>
    </footer>
  </div>

  <script>
    const samples = {
      ar: [
        "يعتمد التطور الحقيقي على الاستمرار في المحاولة حتى عندما تكون البداية بطيئة. كل دقيقة تدريب تضيف ثقة جديدة وتساعدك على قراءة الحروف قبل أن تصل أصابعك إليها.",
        "في الصباح الهادئ تصبح الأفكار أوضح، وتتحول الكتابة إلى إيقاع ثابت بين العين واليد. السرعة لا تأتي من العجلة بل من الدقة والراحة.",
        "كل نص تكتبه اليوم يصنع نسخة أسرع منك غدا. راقب الأخطاء، صحح المسار، واترك أصابعك تتعلم الطريق كلمة بعد كلمة."
      ],
      en: [
        "Practice turns slow typing into a calm rhythm. Keep your eyes ahead of your fingers, stay relaxed, and let each clean word build more speed.",
        "The best typing runs feel smooth because accuracy comes first. When mistakes appear, slow down for a moment and return to a steady pace.",
        "A focused minute can teach your hands a lot. Read the next words early, press each key with purpose, and keep the flow moving forward."
      ]
    };

    const els = {
      languageButtons: document.getElementById("languageButtons"),
      sourceButtons: document.getElementById("sourceButtons"),
      timeButtons: document.getElementById("timeButtons"),
      durationInput: document.getElementById("durationInput"),
      customBox: document.getElementById("customBox"),
      customText: document.getElementById("customText"),
      applyCustomBtn: document.getElementById("applyCustomBtn"),
      typingCard: document.getElementById("typingCard"),
      typingInput: document.getElementById("typingInput"),
      textDisplay: document.getElementById("textDisplay"),
      progressDisplay: document.getElementById("progressDisplay"),
      statusLine: document.getElementById("statusLine"),
      wpmDisplay: document.getElementById("wpmDisplay"),
      accuracyDisplay: document.getElementById("accuracyDisplay"),
      errorDisplay: document.getElementById("errorDisplay"),
      timeDisplay: document.getElementById("timeDisplay"),
      resultsPanel: document.getElementById("resultsPanel"),
      finalWpm: document.getElementById("finalWpm"),
      finalAccuracy: document.getElementById("finalAccuracy"),
      finalChars: document.getElementById("finalChars"),
      bestWpm: document.getElementById("bestWpm"),
      resultChart: document.getElementById("resultChart"),
      startBtn: document.getElementById("startBtn"),
      resetBtn: document.getElementById("resetBtn"),
      newTextBtn: document.getElementById("newTextBtn"),
      focusBtn: document.getElementById("focusBtn"),
      clearBtn: document.getElementById("clearBtn"),
      againBtn: document.getElementById("againBtn")
    };

    const state = {
      language: "ar",
      source: "sample",
      duration: 30,
      sampleIndex: 0,
      targetText: "",
      started: false,
      finished: false,
      startTime: 0,
      elapsedMs: 0,
      timerId: 0,
      lastSampleSecond: -1,
      chartSamples: []
    };

    function normalizeText(value) {
      return String(value || "")
        .replace(/\u00a0/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function getTextDirection() {
      return state.language === "ar" ? "rtl" : "ltr";
    }

    function pickSample(next = false) {
      const list = samples[state.language];
      if (next) {
        state.sampleIndex = (state.sampleIndex + 1) % list.length;
      } else {
        state.sampleIndex = Math.min(state.sampleIndex, list.length - 1);
      }
      return list[state.sampleIndex];
    }

    function setTargetText(next = false) {
      const custom = normalizeText(els.customText.value);
      const nextText = state.source === "custom" && custom ? custom : pickSample(next);
      state.targetText = normalizeText(nextText);
      if (!state.targetText) {
        state.targetText = pickSample(false);
      }
      els.textDisplay.dir = getTextDirection();
      els.typingInput.dir = getTextDirection();
      renderText();
      updateStats();
    }

    function getTyped() {
      return normalizeLiveInput(els.typingInput.value);
    }

    function normalizeLiveInput(value) {
      return String(value || "").replace(/\u00a0/g, " ").replace(/\s+/g, " ");
    }

    function getChars(value) {
      return Array.from(value || "");
    }

    function renderText() {
      const targetChars = getChars(state.targetText);
      const typedChars = getChars(getTyped()).slice(0, targetChars.length);
      const currentIndex = typedChars.length;
      const fragment = document.createDocumentFragment();

      targetChars.forEach((char, index) => {
        const span = document.createElement("span");
        span.className = "char";
        if (char === " ") {
          span.classList.add("space");
          span.textContent = " ";
        } else {
          span.textContent = char;
        }

        if (index < typedChars.length) {
          span.classList.add(typedChars[index] === char ? "correct" : "incorrect");
        }

        if (!state.finished && index === currentIndex) {
          span.classList.add("cursor");
        }

        fragment.appendChild(span);
      });

      if (!state.finished && currentIndex >= targetChars.length) {
        const cursor = document.createElement("span");
        cursor.className = "char cursor";
        cursor.textContent = " ";
        fragment.appendChild(cursor);
      }

      els.textDisplay.replaceChildren(fragment);
      els.progressDisplay.textContent = `${Math.min(currentIndex, targetChars.length)}/${targetChars.length}`;
    }

    function calculateStats() {
      const targetChars = getChars(state.targetText);
      const typedChars = getChars(getTyped()).slice(0, targetChars.length);
      let correct = 0;
      let errors = 0;

      typedChars.forEach((char, index) => {
        if (char === targetChars[index]) {
          correct += 1;
        } else {
          errors += 1;
        }
      });

      const elapsedMinutes = Math.max(state.elapsedMs / 60000, 1 / 60);
      const wpm = Math.round((correct / 5) / elapsedMinutes);
      const accuracy = typedChars.length ? Math.round((correct / typedChars.length) * 100) : 100;
      const progress = targetChars.length ? Math.round((typedChars.length / targetChars.length) * 100) : 0;

      return {
        correct,
        errors,
        typed: typedChars.length,
        total: targetChars.length,
        wpm,
        accuracy,
        progress
      };
    }

    function updateStats() {
      const stats = calculateStats();
      const elapsedSeconds = Math.min(Math.floor(state.elapsedMs / 1000), state.duration);
      els.wpmDisplay.textContent = stats.wpm;
      els.accuracyDisplay.textContent = `${stats.accuracy}%`;
      els.errorDisplay.textContent = stats.errors;
      els.timeDisplay.textContent = `${elapsedSeconds}/${state.duration}`;
      els.statusLine.textContent = state.finished ? "finished" : state.started ? "running" : "ready";

      if (state.started && !state.finished && elapsedSeconds !== state.lastSampleSecond) {
        state.lastSampleSecond = elapsedSeconds;
        state.chartSamples.push({
          second: elapsedSeconds,
          wpm: stats.wpm,
          accuracy: stats.accuracy
        });
      }

      return stats;
    }

    function startTimer() {
      if (state.started || state.finished) return;
      state.started = true;
      state.startTime = Date.now() - state.elapsedMs;
      state.chartSamples = [];
      state.lastSampleSecond = -1;
      els.typingCard.classList.add("active");
      els.resultsPanel.classList.remove("active");
      tick();
      state.timerId = window.setInterval(tick, 120);
    }

    function tick() {
      if (!state.started || state.finished) return;
      state.elapsedMs = Date.now() - state.startTime;
      const stats = updateStats();
      if (state.elapsedMs >= state.duration * 1000 || stats.typed >= stats.total) {
        finishTest();
      }
    }

    function finishTest() {
      if (state.finished) return;
      state.finished = true;
      state.started = false;
      state.elapsedMs = Math.min(state.elapsedMs, state.duration * 1000);
      window.clearInterval(state.timerId);
      els.typingCard.classList.remove("active");
      renderText();
      const stats = updateStats();
      updateResults(stats);
      els.typingInput.blur();
    }

    function updateResults(stats) {
      const bestKey = `speedtype-best-${state.language}`;
      const storedBest = Number(localStorage.getItem(bestKey) || 0);
      const best = Math.max(storedBest, stats.wpm);
      localStorage.setItem(bestKey, String(best));

      els.finalWpm.textContent = stats.wpm;
      els.finalAccuracy.textContent = `${stats.accuracy}%`;
      els.finalChars.textContent = `${stats.correct}/${stats.total}`;
      els.bestWpm.textContent = best;
      els.resultsPanel.classList.add("active");
      window.requestAnimationFrame(drawChart);
    }

    function drawChart() {
      const canvas = els.resultChart;
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      const width = Math.max(320, Math.floor(rect.width));
      const height = Math.max(220, Math.floor(rect.height));
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      const ctx = canvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, width, height);

      const pad = { top: 38, right: 24, bottom: 28, left: 34 };
      const plotW = width - pad.left - pad.right;
      const plotH = height - pad.top - pad.bottom;
      const samplesForChart = state.chartSamples.length ? state.chartSamples : [{ second: 0, wpm: 0, accuracy: 100 }];
      const maxSecond = Math.max(state.duration, ...samplesForChart.map((item) => item.second), 1);
      const maxWpm = Math.max(80, ...samplesForChart.map((item) => item.wpm)) * 1.12;

      ctx.lineWidth = 1;
      ctx.strokeStyle = "rgba(255, 255, 255, 0.08)";
      ctx.fillStyle = "rgba(119, 125, 145, 0.85)";
      ctx.font = "12px Cascadia Mono, Consolas, monospace";
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";

      for (let i = 0; i <= 4; i += 1) {
        const y = pad.top + (plotH / 4) * i;
        ctx.beginPath();
        ctx.moveTo(pad.left, y);
        ctx.lineTo(width - pad.right, y);
        ctx.stroke();
      }

      for (let i = 0; i <= 5; i += 1) {
        const x = pad.left + (plotW / 5) * i;
        ctx.beginPath();
        ctx.moveTo(x, pad.top);
        ctx.lineTo(x, pad.top + plotH);
        ctx.stroke();
      }

      function point(sample, type) {
        const x = pad.left + (sample.second / maxSecond) * plotW;
        const scale = type === "wpm" ? sample.wpm / maxWpm : sample.accuracy / 100;
        const y = pad.top + plotH - Math.max(0, Math.min(1, scale)) * plotH;
        return { x, y };
      }

      function line(type, color, widthValue) {
        ctx.beginPath();
        samplesForChart.forEach((sample, index) => {
          const p = point(sample, type);
          if (index === 0) {
            ctx.moveTo(p.x, p.y);
          } else {
            ctx.lineTo(p.x, p.y);
          }
        });
        ctx.strokeStyle = color;
        ctx.lineWidth = widthValue;
        ctx.lineJoin = "round";
        ctx.lineCap = "round";
        ctx.stroke();
      }

      line("accuracy", "rgba(139, 144, 165, 0.95)", 3);
      line("wpm", "#f3b11d", 4);

      const last = samplesForChart[samplesForChart.length - 1];
      const lastPoint = point(last, "wpm");
      ctx.fillStyle = "#f3b11d";
      ctx.beginPath();
      ctx.arc(lastPoint.x, lastPoint.y, 5, 0, Math.PI * 2);
      ctx.fill();
    }

    function resetTest(options = {}) {
      window.clearInterval(state.timerId);
      state.started = false;
      state.finished = false;
      state.elapsedMs = 0;
      state.startTime = 0;
      state.lastSampleSecond = -1;
      state.chartSamples = [];
      els.typingInput.value = "";
      els.typingCard.classList.remove("active");
      els.resultsPanel.classList.remove("active");
      if (options.newText) {
        setTargetText(true);
      } else {
        setTargetText(false);
      }
      renderText();
      updateStats();
      if (options.focus) {
        focusTyping();
      }
    }

    function focusTyping() {
      els.typingCard.focus();
      els.typingInput.focus();
    }

    function setActiveButton(group, selector, value) {
      group.querySelectorAll("button").forEach((button) => {
        button.classList.toggle("active", button.dataset[selector] === value);
      });
    }

    function syncDuration(value) {
      const clean = Math.max(5, Math.min(600, Number(value) || 30));
      state.duration = clean;
      els.durationInput.value = clean;
      els.timeButtons.querySelectorAll("button").forEach((button) => {
        button.classList.toggle("active", Number(button.dataset.time) === clean);
      });
      resetTest();
    }

    els.typingInput.addEventListener("input", () => {
      const targetLength = getChars(state.targetText).length;
      const normalized = getChars(normalizeLiveInput(els.typingInput.value)).slice(0, targetLength).join("");
      if (els.typingInput.value !== normalized) {
        els.typingInput.value = normalized;
      }

      if (normalized.length > 0) {
        startTimer();
      }

      renderText();
      const stats = updateStats();
      if (stats.typed >= stats.total && stats.total > 0) {
        finishTest();
      }
    });

    els.typingInput.addEventListener("keydown", (event) => {
      if (event.key === "Tab") {
        event.preventDefault();
      }
      if (state.finished && event.key.length === 1) {
        event.preventDefault();
      }
    });

    els.typingCard.addEventListener("click", focusTyping);
    els.focusBtn.addEventListener("click", focusTyping);
    els.startBtn.addEventListener("click", () => resetTest({ focus: true }));
    els.resetBtn.addEventListener("click", () => resetTest({ focus: true }));
    els.againBtn.addEventListener("click", () => resetTest({ focus: true }));
    els.clearBtn.addEventListener("click", () => {
      els.typingInput.value = "";
      renderText();
      updateStats();
      focusTyping();
    });
    els.newTextBtn.addEventListener("click", () => resetTest({ newText: true, focus: true }));

    els.languageButtons.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-language]");
      if (!button) return;
      state.language = button.dataset.language;
      setActiveButton(els.languageButtons, "language", state.language);
      resetTest({ focus: true });
    });

    els.sourceButtons.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-source]");
      if (!button) return;
      state.source = button.dataset.source;
      setActiveButton(els.sourceButtons, "source", state.source);
      els.customBox.classList.toggle("active", state.source === "custom");
      resetTest({ focus: state.source !== "custom" });
      if (state.source === "custom") {
        els.customText.focus();
      }
    });

    els.timeButtons.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-time]");
      if (!button) return;
      syncDuration(Number(button.dataset.time));
    });

    els.durationInput.addEventListener("change", () => syncDuration(els.durationInput.value));
    els.applyCustomBtn.addEventListener("click", () => resetTest({ focus: true }));
    els.customText.addEventListener("input", () => {
      if (state.source === "custom" && !state.started) {
        setTargetText(false);
      }
    });

    document.addEventListener("keydown", (event) => {
      const active = document.activeElement;
      const isEditing = active === els.customText || active === els.durationInput;
      const shouldCapture = !isEditing && active !== els.typingInput && !event.ctrlKey && !event.metaKey && !event.altKey && (event.key.length === 1 || event.key === "Backspace");
      if (!shouldCapture || state.finished) return;

      event.preventDefault();
      focusTyping();

      if (event.key === "Backspace") {
        els.typingInput.value = getChars(els.typingInput.value).slice(0, -1).join("");
      } else {
        els.typingInput.value += event.key;
      }

      els.typingInput.dispatchEvent(new Event("input", { bubbles: true }));
    });

    window.addEventListener("resize", () => {
      if (els.resultsPanel.classList.contains("active")) {
        drawChart();
      }
    });

    setTargetText(false);
    renderText();
    updateStats();
  </script>
</body>
</html>
